[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-cooling-planner"
version = "0.1.0"
description = "AI + GIS + Graph ML system detecting urban heat hotspots, optimizing cooling interventions, and planning heat-safe walking routes in Pune, India."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Urban Cooling Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyogrio>=0.7.0",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "ortools>=9.9.0",
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "osmnx>=2.0.0",
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "rasterio>=1.4.0",
    "sqlalchemy>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "data*", "ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Trailing double-spaces are Markdown hard line breaks in the generated report
"data/pipeline.py" = ["W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
