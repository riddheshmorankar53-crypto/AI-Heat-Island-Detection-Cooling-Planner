name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  test-backend:
    name: Backend Tests & Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: tests need no GPU, and it skips ~2GB of CUDA wheels
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Generate Synthetic Grid & Network Data
        run: python data/pipeline.py

      - name: Train Models & Generate Artifacts
        run: python ml/train.py

      - name: Run PyTest Suite
        run: pytest tests/ -v

  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-image:
    name: Deploy Image Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build single-container image (what Render deploys)
        run: docker build -t pune-cooling-planner .

      - name: Serve with an injected PORT and probe API + dashboard
        run: |
          docker run -d --name app -e PORT=10000 -p 10000:10000 pune-cooling-planner
          for i in $(seq 1 30); do curl -sf localhost:10000/api/v1/health && break; sleep 2; done
          curl -sf localhost:10000/api/v1/health
          curl -sf localhost:10000/ | grep -q "<div id=\"root\">"
          curl -sf -X POST localhost:10000/api/v1/interventions/optimize \
            -H 'Content-Type: application/json' \
            -d '{"budget_inr":1500000,"enabled_types":["trees","shaded_stops"],"max_interventions_per_cell":1}' \
            | grep -q '"status":"OPTIMAL"'
