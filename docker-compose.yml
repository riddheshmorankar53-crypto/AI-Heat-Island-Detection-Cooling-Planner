version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pune_cooling_postgis
    environment:
      POSTGRES_DB: pune_cooling_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pune_cooling_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pune_cooling_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pune_cooling_planner
      USE_POSTGIS: "true"
      PORT: "8000"
      HOST: "0.0.0.0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pune_cooling_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgis_data:
