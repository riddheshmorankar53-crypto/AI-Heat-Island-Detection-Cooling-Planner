version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pune_cooling_backend
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pune_cooling_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
